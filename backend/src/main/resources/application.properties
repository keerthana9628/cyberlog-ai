server.port=${PORT:8080}
# SQLite file (created automatically). Override with DB_PATH on a server.
spring.datasource.url=jdbc:sqlite:${DB_PATH:../database/cyberlog.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Serve the frontend folder at http://localhost:8080
spring.web.resources.static-locations=file:${FRONTEND_DIR:../frontend/}
# AI service
cyberlog.ai.url=${AI_URL:http://localhost:5000}
# Detection thresholds (configurable)
cyberlog.bf.max-fails=5
cyberlog.bf.window-sec=60
cyberlog.scan.min-ports=10
cyberlog.scan.window-sec=60
